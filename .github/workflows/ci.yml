# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libpng-dev libgl1-mesa-dev libglx-dev \
            libx11-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dri xvfb

      # FetchContent talks to the network at configure time, never at build time.
      - name: cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configure
        run: cmake -B build -G Ninja

      - name: build
        run: cmake --build build

      # The viewport golden needs a GL context: Xvfb + llvmpipe, no GPU.
      - name: test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # A golden that matches once but not twice is nondeterminism, not a test.
      - name: test again (capture stability)
        run: xvfb-run -a ctest --test-dir build -R 'test_view_golden' --output-on-failure
