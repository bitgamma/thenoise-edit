# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 python3-numpy python3-pil \
            libpng-dev libjpeg-dev libwebp-dev zlib1g-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev libglx-dev \
            libx11-dev libxcursor-dev libxi-dev libgtk-3-dev libxtst6 \
            libgl1-mesa-dri xvfb

      # FetchContent talks to the network at configure time, never at build time.
      - name: cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configure
        run: cmake -B build -G Ninja

      - name: build
        run: cmake --build build

      # The viewport golden needs a GL context: Xvfb + llvmpipe, no GPU.
      - name: test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # A golden that matches once but not twice is nondeterminism, not a test.
      - name: test again (capture stability)
        run: xvfb-run -a ctest --test-dir build -R 'test_view_golden' --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV

      - name: cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-2026.10.16-x64-windows-static-${{ hashFiles('vcpkg.json') }}

      - name: configure vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-bincache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-bincache" >> $env:GITHUB_ENV

      - name: configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: build
        run: cmake --build build-windows --config Release --parallel 4

      # Native C++ tests need no GUI. Linux alone runs the X11-driven Python probes.
      - name: native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

      # Include the editor and installed assets in a portable zip-ready directory.
      - name: install
        run: cmake --install build-windows --config Release --prefix dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: thenoise-edit-windows-x64
          path: dist-windows/
